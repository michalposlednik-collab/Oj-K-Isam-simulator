<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse Manager Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1724;color:#eef2f7;font-family:Arial,sans-serif}
#app{max-width:920px;margin:auto;padding:24px}
h1{margin:0 0 4px}.sub{color:#94a3b8}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}
.stat,.card{background:#1b2737;border:1px solid #35455a;border-radius:12px;padding:16px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#94a3b8}
.card{margin-bottom:14px}.tag{font-size:11px;font-weight:bold;text-transform:uppercase;color:#60a5fa}
.story{line-height:1.6}.box{background:#26364a;border-radius:8px;padding:13px;margin:12px 0}
button{width:100%;display:block;padding:13px;margin:8px 0;border:1px solid #465a73;border-radius:8px;background:#25374d;color:white;text-align:left;cursor:pointer}
button:hover{background:#315170}.primary{background:#2563eb}.good{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #37465a;text-align:left}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";

const DRIVERS=["Arek","Norbert","Axel","Adam","Niko","Indri","Einar","Daniel","Davið"];
const SALES=["Fitim","Atli","Andri","Eggert","Matti","Gisli","Anton","Maggi Roberts","Skuli","Lárus","Bjössi"];
const SERVICE=["Kristjana","Auður","Hildur","Stefania"];
const CALLERS=["Hanna","Bragi",...SALES];
const CUSTOMERS=[
"Bónus Akranes","Bónus Borgarnes","Bónus Selfoss","Lunaveitingar","Alfasaga",
"Waterfront Akureyri","Frosti","Hotel Borgarnes","Hótel Selfoss","Hotel Akureyri",
"Lón Restaurant","Riverside Restaurant","Hótel Vesturland","Iðunn Mathöll",
"Bryggjan Akureyri","Kaffi Ilmur","BARA Borgarnes","La Colina","Englendingavík"
];
const PRODUCTS=["dry goods","chilled goods","frozen goods","fresh meat","mixed grocery","hotel supplies","restaurant ingredients"];

const state={
 day:1, orderNo:0, good:0, totalGood:0, totalOrders:0,
 money:10000, reputation:100, ontime:100, incidents:0,
 sick:[], current:null, dayStarted:false
};

function r(a){return a[Math.floor(Math.random()*a.length)]}
function chance(p){return Math.random()<p}
function money(n){return Math.round(n).toLocaleString("en-US")}
function save(){try{localStorage.setItem("warehouse_simulator_v3",JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem("warehouse_simulator_v3"));if(x)Object.assign(state,x)}catch(e){}}
function reset(){localStorage.removeItem("warehouse_simulator_v3");location.reload()}

function stats(){
return `<div class="stats">
<div class="stat"><b>${money(state.money)}</b><span>Budget / ISK</span></div>
<div class="stat"><b>${state.reputation}</b><span>Reputation</span></div>
<div class="stat"><b>${state.ontime}%</b><span>On-time rate</span></div>
<div class="stat"><b>${state.orderNo}/190</b><span>Today's orders</span></div>
<div class="stat"><b>${state.incidents}</b><span>Today's incidents</span></div>
</div>`;
}
function render(content){
document.getElementById("app").innerHTML=
`<h1>Warehouse Manager Simulator</h1>
<div class="sub">Distribution Centre • Day ${state.day} of 30 • ~190 orders per day</div>
${stats()}${content}`;
}

function home(){
render(`<div class="card">
<div class="tag">Management briefing</div>
<h2>Welcome to the warehouse.</h2>
<p class="story">You are responsible for a month of operations: approximately <b>5,700 orders</b>. Most orders should go exactly according to plan. The problem is that people are involved.</p>
<p class="story">Sales, Orders, drivers, Customer Service, Eimskip, customers and the weather can all make your day interesting.</p>
<button class="primary" onclick="startDay()">Start Day 1 →</button>
<button onclick="reset()">Reset game</button>
</div>`);
}

function startDay(){
state.orderNo=0;
state.good=0;
state.incidents=0;
state.sick=[];
state.dayStarted=true;

if(chance(0.06)){
state.sick=DRIVERS.filter(()=>chance(0.5));
while(state.sick.length<4) {
const d=r(DRIVERS);
if(!state.sick.includes(d))state.sick.push(d);
}
return specialEvent(
"CRITICAL STAFFING FAILURE",
`${state.sick.join(", ")} have reported <b>veikur</b>. Almost half of the driving team is unavailable.`,
["Call Jón Páll — the emergency saviour","Rebuild routes internally","Cancel the lowest-priority deliveries"]
);
}

if(chance(0.22)){
state.sick=[r(DRIVERS)];
if(chance(0.35)){
let d=r(DRIVERS.filter(x=>x!==state.sick[0]));
state.sick.push(d);
}
return specialEvent(
"DRIVER VEIKUR",
`${state.sick.join(" and ")} reported <b>veikur</b> this morning. Routes need to be rearranged.`,
["Rebuild the routes","Call Jón Páll","Pretend everything is fine"]
);
}

if(chance(0.09)){
return specialEvent(
"GOLF SHIPMENT AMBUSH",
`Sales has suddenly brought <b>${12+Math.floor(Math.random()*25)} boxes</b> for several golf courses. They want them shipped immediately.`,
["Push the golf shipment to the front","Make Sales wait for the normal cut-off","Split it between available drivers"]
);
}

nextOrder();
}

function specialEvent(title,text,options){
state.incidents++;
state.current={type:"special",title:title};
render(`<div class="card">
<div class="tag">Random operational event</div>
<h2>${title}</h2>
<p class="story">${text}</p>
${options.map((x,i)=>`<button onclick="specialChoice(${i})">${x}</button>`).join("")}
</div>`);
}

function specialChoice(i){
const t=state.current.title;
if(t==="CRITICAL STAFFING FAILURE"){
if(i===0){state.money-=350}
if(i===1){state.money-=180;state.ontime-=4}
if(i===2){state.money-=600;state.reputation-=6;state.ontime-=8}
}
else if(t==="DRIVER VEIKUR"){
if(i===0){state.money-=120;state.ontime-=2}
if(i===1){state.money-=300}
if(i===2){state.money-=200;state.reputation-=4;state.ontime-=4}
}
else{
if(i===0){state.money+=250;state.ontime-=2}
if(i===1){state.reputation-=3}
if(i===2){state.money-=120}
}
clamp();
save();
nextOrder();
}

function nextOrder(){
if(state.orderNo>=190)return endDay();

state.orderNo++;
state.totalOrders++;

const available=DRIVERS.filter(d=>!state.sick.includes(d));
const driver=available.length?r(available):r(DRIVERS);

state.current={
customer:r(CUSTOMERS),
product:r(PRODUCTS),
driver:driver,
seller:r(SALES),
hour:chance(0.72)?8+Math.floor(Math.random()*3):11+Math.floor(Math.random()*5)
};

showOrder();
}

function showOrder(){
const o=state.current;
const late=o.hour>=11;
const excuses=[
"The customer forgot to order.",
"The website wasn't working.",
"I thought I had already entered it.",
"The customer changed the order at the last minute.",
"AX was running slowly.",
"I was dealing with another customer.",
"It was in my notes. I just forgot to put it into AX.",
"The customer called me and I completely forgot to enter it."
];

render(`<div class="card">
<div class="tag">Order ${state.orderNo} / 190 • Sales → AX → Orders</div>
<h2>${o.customer}</h2>
<div class="box">
<b>Product:</b> ${o.product}<br>
<b>Salesperson:</b> ${o.seller}<br>
<b>AX entry:</b> ${String(o.hour).padStart(2,"0")}:00<br>
<b>Required cut-off:</b> 11:00<br>
<b>Assigned driver:</b> ${o.driver}
</div>
${late?`<div class="box"><b>${o.seller} – Sales:</b> "${r(excuses)}"</div>`:""}
<p class="story">${late?
"This order was entered after the 11:00 cut-off. The warehouse has already planned the workload.":
"The order is in AX on time. For once, everything looks normal."}</p>
<button class="primary" onclick="pickOrder('rush')">Rush it through picking</button>
<button onclick="pickOrder('normal')">Follow the normal picking sequence</button>
<button onclick="pickOrder('check')">Double-check everything</button>
</div>`);
}

function pickOrder(mode){
let probability=0.20;
if(state.current.hour>=11)probability+=0.12;
if(mode==="rush")probability+=0.05;
if(mode==="check")probability-=0.08;

if(chance(probability))return orderProblem();
dispatch();
}

function orderProblem(){
const o=state.current;
const problems=[
["WRONG ORDER LABEL",`${o.seller} labelled the order incorrectly. Two similar orders were nearly mixed up.`,140],
["WRONG PRODUCT","Someone from Orders picked the wrong product. Re-picking is required.",180],
["WRONG LOCATION","Someone put the completed order in the wrong location. <b>Daniel Dagur</b> has to search for it.",170],
["MISSING CARTON","One carton is missing from the completed order. Nobody knows where it went.",150],
["LATE PICKING","The order arrived too late from Sales and missed the planned picking window.",220],
["QUANTITY MISMATCH","The quantity picked does not match the order. Another count is required.",130],
["DUPLICATE ORDER","The same customer appears twice in AX and nobody knows which version is final.",100],
["WRONG CUSTOMER","The order was attached to the wrong customer account.",160],
["PRODUCT DOES NOT EXIST","AX says the item exists. The warehouse says otherwise.",190],
["TEMPERATURE MIX-UP","Frozen/chilled goods were placed in the wrong temperature zone.",180],
["ORDER NOT COMPLETE","One section of the order was never picked.",200],
["BAD HANDOVER","The order was moved before the picking team finished checking it.",160]
];
const q=r(problems);
state.incidents++;
state.money-=q[2];
state.reputation-=1;
clamp();save();

render(`<div class="card">
<div class="tag">Orders / Warehouse incident</div>
<h2>${q[0]}</h2>
<p class="story">${q[1]}</p>
<div class="box bad">Operational cost: -${money(q[2])} ISK</div>
<button class="primary" onclick="dispatch()">Fix the problem and continue →</button>
</div>`);
}

function dispatch(){
const o=state.current;
const cs=chance(0.38)?r(SERVICE):null;
const caller=chance(0.30)?r(CALLERS):null;
const forgotten=chance(0.12);

render(`<div class="card">
<div class="tag">Dispatch</div>
<h2>${o.driver} is ready to leave.</h2>
<p class="story">The pallet is loaded. The route is waiting. This is your final chance to catch a problem before the truck leaves.</p>
<div class="box"><b>Customer:</b> ${o.customer}<br><b>Driver:</b> ${o.driver}</div>
${cs?`<div class="box"><b>${cs} – Customer Service:</b> "Can you confirm the delivery time? The customer is asking."</div>`:""}
${caller?`<div class="box"><b>${caller} – Sales:</b> "Any update on my customer's order?"</div>`:""}
${forgotten?`<div class="box warn"><b>Loading warning:</b> Something may have been left behind.</div>`:""}
<button class="primary" onclick="drive(${forgotten},false)">Send the driver →</button>
<button onclick="drive(false,true)">Perform final carton check →</button>
</div>`);
}

function drive(forgotten,checked){
if(forgotten&&!checked&&chance(0.75)){
state.incidents++;
state.money-=180;
state.reputation-=2;
clamp();save();
render(`<div class="card">
<div class="tag">Driver problem</div>
<h2>One carton stayed behind.</h2>
<p class="story"><b>${state.current.driver}</b> calls from the road: "I think I forgot one carton."</p>
<p class="story">The carton is still in the warehouse. The customer is already waiting.</p>
<button class="primary" onclick="finishOrder(false)">Send a rescue delivery →</button>
<button onclick="finishOrder(false)">Wait for the next scheduled route</button>
</div>`);
return;
}

let p=checked?0.10:0.20;
if(chance(p))return driverProblem();
finishOrder(true);
}

function driverProblem(){
const o=state.current;
const problems=[
["WRONG ADDRESS",`${o.driver} followed the wrong address and is nowhere near the planned stop.`,320],
["PARKING TICKET",`${o.driver} received a parking ticket on Laugavegur.`,500],
["CUSTOMER UNAVAILABLE","The customer is not available and the driver is waiting outside.",180],
["MISSING CONFIRMATION","Goods were delivered, but the delivery confirmation is missing.",120],
["TRAFFIC DELAY","Traffic turned a normal delivery into a long delay.",150],
["WRONG PALLET","The driver loaded the wrong pallet. The correct one is still at the warehouse.",300],
["CUSTOMER COMPLAINT","The customer is angry because the goods arrived late.",220]
];
const q=r(problems);
state.incidents++;
state.money-=q[2];
state.reputation-=2;
state.ontime=Math.max(0,state.ontime-1);
clamp();save();

render(`<div class="card">
<div class="tag">Driver / Customer incident</div>
<h2>${q[0]}</h2>
<p class="story">${q[1]}</p>
<div class="box bad">Impact: -${money(q[2])} ISK</div>
<button class="primary" onclick="finishOrder(false)">Handle the situation →</button>
</div>`);
}

function finishOrder(success){
if(success){
state.good++;
state.totalGood++;
state.money+=55;
}else{
state.money-=80;
state.ontime=Math.max(0,state.ontime-1);
}
if(chance(0.16)){
state.incidents++;
const person=r(SERVICE);
const question=r([
"Can you confirm the delivery time?",
"The customer says one product is missing. Can you check?",
"Can you confirm whether the frozen goods were delivered?",
"The customer is asking why the order arrived late.",
"Do we know where the missing carton is?"
]);
save();
render(`<div class="card">
<div class="tag">Customer Service follow-up</div>
<h2>${person} is calling.</h2>
<p class="story"><b>${person}:</b> "${question}"</p>
<button class="primary" onclick="nextOrder()">Check the details and reply →</button>
</div>`);
return;
}
clamp();save();
nextOrder();
}

function endDay(){
render(`<div class="card">
<div class="tag">End of day</div>
<h2>Day ${state.day} complete</h2>
<p class="story"><b>190 orders</b> processed. Tomorrow, you do it all again.</p>
<table>
<tr><th>Orders processed</th><td>190</td></tr>
<tr><th>Successful deliveries</th><td>${state.good}</td></tr>
<tr><th>Incidents</th><td>${state.incidents}</td></tr>
<tr><th>Budget</th><td>${money(state.money)} ISK</td></tr>
<tr><th>Reputation</th><td>${state.reputation}/100</td></tr>
</table>
<button class="primary" onclick="nextDay()">Start Day ${state.day+1} →</button>
<button onclick="reset()">Reset game</button>
</div>`);
}

function nextDay(){
state.day++;
if(state.day>30)return monthEnd();
save();
startDay();
}

function monthEnd(){
const score=state.money+state.reputation*50+state.ontime*40;
render(`<div class="card">
<div class="tag">Monthly management review</div>
<h2>30 Days Completed</h2>
<p class="story">You survived approximately <b>5,700 orders</b>. The warehouse is still standing.</p>
<table>
<tr><th>Days completed</th><td>30</td></tr>
<tr><th>Orders processed</th><td>${state.totalOrders}</td></tr>
<tr><th>Successful deliveries</th><td>${state.totalGood}</td></tr>
<tr><th>Budget</th><td>${money(state.money)} ISK</td></tr>
<tr><th>Reputation</th><td>${state.reputation}/100</td></tr>
<tr><th>On-time rate</th><td>${state.ontime}%</td></tr>
<tr><th>Final score</th><td>${money(score)}</td></tr>
</table>
<button class="primary" onclick="reset()">Start a new month</button>
</div>`);
}

function clamp(){
state.reputation=Math.max(0,Math.min(100,state.reputation));
state.ontime=Math.max(0,Math.min(100,state.ontime));
}

load();
home();
</script>
</body>
</html>
