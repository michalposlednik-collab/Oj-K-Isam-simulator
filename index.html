<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse Manager Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1724;color:#eef2f7;font-family:Arial,sans-serif}
#app{max-width:920px;margin:auto;padding:24px}
h1{margin:0 0 4px}.sub{color:#94a3b8}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}
.stat,.card{background:#1b2737;border:1px solid #35455a;border-radius:12px;padding:16px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#94a3b8}
.card{margin-bottom:14px}.tag{font-size:11px;font-weight:bold;text-transform:uppercase;color:#60a5fa}
.story{line-height:1.6}.box{background:#26364a;border-radius:8px;padding:13px;margin:12px 0}
button{width:100%;display:block;padding:13px;margin:8px 0;border:1px solid #465a73;border-radius:8px;background:#25374d;color:white;text-align:left;cursor:pointer}
button:hover{background:#315170}.primary{background:#2563eb}.good{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #37465a;text-align:left}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";

const DRIVERS=["Arek","Norbert","Axel","Adam","Niko","Indri","Einar","Daniel","Davið"];
const SALES=["Fitim","Atli","Andri","Eggert","Matti","Gisli","Anton","Maggi Roberts","Skuli","Lárus","Bjössi"];
const SERVICE=["Kristjana","Auður","Hildur","Stefania"];
const CALLERS=["Hanna","Bragi",...SALES];
const CUSTOMERS=[
"Bónus Akranes","Bónus Borgarnes","Bónus Selfoss","Lunaveitingar","Alfasaga",
"Waterfront Akureyri","Frosti","Hotel Borgarnes","Hótel Selfoss","Hotel Akureyri",
"Lón Restaurant","Riverside Restaurant","Hótel Vesturland","Iðunn Mathöll",
"Bryggjan Akureyri","Kaffi Ilmur","BARA Borgarnes","La Colina","Englendingavík"
];
const PRODUCTS=["dry goods","chilled goods","frozen goods","fresh meat","mixed grocery","hotel supplies","restaurant ingredients","beverages","bakery products","dairy products"];

const state={
 day:1, orderNo:0, good:0, totalGood:0, totalOrders:0,
 money:10000, reputation:100, ontime:100, incidents:0,
 sick:[], current:null, dayStarted:false
};

function r(a){return a[Math.floor(Math.random()*a.length)]}
function chance(p){return Math.random()<p}
function money(n){return Math.round(n).toLocaleString("en-US")}
function save(){try{localStorage.setItem("warehouse_simulator_v3",JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem("warehouse_simulator_v3"));if(x)Object.assign(state,x)}catch(e){}}
function reset(){localStorage.removeItem("warehouse_simulator_v3");location.reload()}

function stats(){
return `<div class="stats">
<div class="stat"><b>${money(state.money)}</b><span>Budget / ISK</span></div>
<div class="stat"><b>${state.reputation}</b><span>Reputation</span></div>
<div class="stat"><b>${state.ontime}%</b><span>On-time rate</span></div>
<div class="stat"><b>${state.orderNo}/20</b><span>Today's orders</span></div>
<div class="stat"><b>${state.incidents}</b><span>Today's incidents</span></div>
</div>`;
}
function render(content){
document.getElementById("app").innerHTML=
`<h1>Warehouse Manager Simulator</h1>
<div class="sub">Distribution Centre • Day ${state.day} of 30 • ~20 orders per day</div>
${stats()}${content}`;
}

function home(){
render(`<div class="card">
<div class="tag">Management briefing</div>
<h2>Welcome to the warehouse.</h2>
<p class="story">You are responsible for a month of operations: approximately <b>600 orders</b>. Most orders should go exactly according to plan. The problem is that people are involved.</p>
<p class="story">Sales, Orders, drivers, Customer Service, Eimskip, customers and the weather can all make your day interesting.</p>
<button class="primary" onclick="startDay()">Start Day 1 →</button>
<button onclick="reset()">Reset game</button>
</div>`);
}

function startDay(){
// Management target: most days should finish positively.
if(chance(0.70)){
  state.money += 1200;
  state.reputation += 1;
}

if(state.orderNo>=20 && chance(0.30)){
  const bonus=r([
    ["DAY TARGET BONUS","The daily target was reached.",1200],
    ["SERVICE LEVEL BONUS","Customer Service reports a strong day.",900],
    ["ZERO-MISS BONUS","No major shipment was lost today.",700],
    ["DRIVER EFFICIENCY BONUS","The routes were completed efficiently.",800]
  ]);
  state.money+=bonus[2];
  state.reputation+=2;
}

state.orderNo=0;
state.good=0;
state.incidents=0;
state.sick=[];
state.dayStarted=true;

if(chance(0.12)){
return specialEvent("AX UPDATE PANIC","AX is behaving strangely this morning. Several orders are visible but the warehouse queue looks incomplete.",["Work from the visible queue","Wait for AX to stabilise","Create a manual priority list"]);
}
if(chance(0.06)){
return specialEvent("CHILLED ROOM CONGESTION","The chilled area is full and the first wave of orders is already waiting for space.",["Reorganise the chilled area","Keep picking and stack temporarily","Move some work to another team"]);
}
if(chance(0.10)){
return specialEvent("FREEZER DOOR DRAMA","The freezer door has been left open and everyone is suddenly an expert in temperature control.",["Stop and secure the freezer","Keep working and deal with it later","Call maintenance"]);
}
if(chance(0.05)){
return specialEvent("PALLET SHORTAGE","There are fewer empty pallets than expected. Someone has apparently used them all overnight.",["Collect empty pallets immediately","Reuse available pallets","Call for an emergency pallet delivery"]);
}
if(chance(0.05)){
return specialEvent("LABEL PRINTER FAILURE","The label printer decides that today is the day it will no longer cooperate.",["Fix it before picking","Use manual labels","Move the printer to another station"]);
}
if(chance(0.13)){
return specialEvent("SALES PROMISED TOO MUCH","A salesperson has promised a customer a delivery time that does not match the warehouse schedule.",["Protect the planned schedule","Try to make the promise work","Call Sales and reset expectations"]);
}
if(chance(0.04)){
return specialEvent("MYSTERY PALLET","A pallet is sitting in the dispatch area with no clear owner. Three people claim it might be theirs.",["Investigate before loading","Load it with the next route","Ask Sales to identify it"]);
}
if(chance(0.04)){
return specialEvent("MORNING COFFEE CRISIS","The coffee machine has stopped working. Productivity reports suggest this may be a serious operational incident.",["Fix the coffee machine","Ignore it","Send someone to buy coffee"]);
}
if(chance(0.08)){
return specialEvent("MORNING WAREHOUSE CHAOS","Several pallets from yesterday were left in unexpected locations. <b>Daniel Dagur</b> is already looking for one of them.",["Reorganise before picking starts","Deal with it during the morning","Send Daniel Dagur to sort it out"]);
}
if(chance(0.11)){
return specialEvent("SALES PHONE STORM","Hanna, Bragi and two salespeople call within ten minutes asking about different deliveries.",["Stop and reconcile the requests","Tell them to email the details","Let the warehouse keep working"]);
}
if(chance(0.05)){
return specialEvent("EIMSKIP PALLET SEQUENCE","The first collection is ready, but pallets are being selected out of sequence.",["Restore the planned sequence","Let the driver choose","Send your own driver with the remaining pallets"]);
}
if(chance(0.04)){
return specialEvent("GOLF COURSE EXPRESS","Sales has suddenly brought another batch of golf-course cartons that must go immediately.",["Prioritise the golf shipment","Keep the normal warehouse plan","Split it between routes"]);
}

if(chance(0.06)){
state.sick=DRIVERS.filter(()=>chance(0.5));
while(state.sick.length<4) {
const d=r(DRIVERS);
if(!state.sick.includes(d))state.sick.push(d);
}
return specialEvent(
"CRITICAL STAFFING FAILURE",
`${state.sick.join(", ")} have reported <b>veikur</b>. Almost half of the driving team is unavailable.`,
["Call Jón Páll — the emergency saviour","Rebuild routes internally","Cancel the lowest-priority deliveries"]
);
}

if(chance(0.22)){
state.sick=[r(DRIVERS)];
if(chance(0.35)){
let d=r(DRIVERS.filter(x=>x!==state.sick[0]));
state.sick.push(d);
}
return specialEvent(
"DRIVER VEIKUR",
`${state.sick.join(" and ")} reported <b>veikur</b> this morning. Routes need to be rearranged.`,
["Rebuild the routes","Call Jón Páll","Pretend everything is fine"]
);
}

if(chance(0.09)){
return specialEvent(
"GOLF SHIPMENT AMBUSH",
`Sales has suddenly brought <b>${12+Math.floor(Math.random()*25)} boxes</b> for several golf courses. They want them shipped immediately.`,
["Push the golf shipment to the front","Make Sales wait for the normal cut-off","Split it between available drivers"]
);
}

nextOrder();
}

function specialEvent(title,text,options){
state.incidents++;
state.current={type:"special",title:title};
render(`<div class="card">
<div class="tag">Random operational event</div>
<h2>${title}</h2>
<p class="story">${text}</p>
${options.map((x,i)=>`<button onclick="specialChoice(${i})">${x}</button>`).join("")}
</div>`);
}

function specialChoice(i){
const t=state.current.title;
if(t==="AX UPDATE PANIC"){
 if(i===0){state.money-=33}
 if(i===1){state.ontime-=2}
 if(i===2){state.money-=50}
}
else if(t==="CHILLED ROOM CONGESTION"){
 if(i===0){state.money-=44}
 if(i===1){state.ontime-=2}
 if(i===2){state.money-=50}
}
else if(t==="FREEZER DOOR DRAMA"){
 if(i===0){state.money-=22}
 if(i===1){state.ontime-=3;state.reputation-=1}
 if(i===2){state.money-=50}
}
else if(t==="PALLET SHORTAGE"){
 if(i===0){state.money-=38}
 if(i===1){state.ontime-=1}
 if(i===2){state.money-=50}
}
else if(t==="LABEL PRINTER FAILURE"){
 if(i===0){state.money-=28}
 if(i===1){state.money-=20;state.ontime-=1}
 if(i===2){state.money-=50}
}
else if(t==="SALES PROMISED TOO MUCH"){
 if(i===0){state.reputation+=1}
 if(i===1){state.money-=50;state.ontime-=2}
 if(i===2){state.reputation-=1}
}
else if(t==="MYSTERY PALLET"){
 if(i===0){state.money-=28}
 if(i===1){state.ontime-=3;state.reputation-=2}
 if(i===2){state.reputation-=1}
}
else if(t==="MORNING COFFEE CRISIS"){
 if(i===0){state.money-=20}
 if(i===1){state.reputation-=1}
 if(i===2){state.money-=25}
}
else if(t==="MORNING WAREHOUSE CHAOS"){
if(i===0){state.money-=50}
if(i===1){state.money-=50;state.ontime-=2}
if(i===2){state.money-=33}
}
else if(t==="SALES PHONE STORM"){
if(i===0){state.money-=44}
if(i===1){state.reputation-=2}
if(i===2){state.reputation-=1}
}
else if(t==="EIMSKIP PALLET SEQUENCE"){
if(i===0){state.money-=28}
if(i===1){state.ontime-=3;state.reputation-=2}
if(i===2){state.money-=50;state.ontime-=1}
}
else if(t==="GOLF COURSE EXPRESS"){
if(i===0){state.money+=180;state.ontime-=1}
if(i===1){state.reputation-=2}
if(i===2){state.money-=44}
}
else if(t==="CRITICAL STAFFING FAILURE"){
if(i===0){state.money-=50}
if(i===1){state.money-=50;state.ontime-=4}
if(i===2){state.money-=50;state.reputation-=6;state.ontime-=8}
}
else if(t==="DRIVER VEIKUR"){
if(i===0){state.money-=50;state.ontime-=2}
if(i===1){state.money-=50}
if(i===2){state.money-=50;state.reputation-=4;state.ontime-=4}
}
else{
if(i===0){state.money+=250;state.ontime-=2}
if(i===1){state.reputation-=3}
if(i===2){state.money-=50}
}
clamp();
save();
nextOrder();
}

function nextOrder(){
if(state.orderNo>=20)return endDay();

state.orderNo++;
state.totalOrders++;

const available=DRIVERS.filter(d=>!state.sick.includes(d));
const driver=available.length?r(available):r(DRIVERS);

state.current={
customer:r(CUSTOMERS),
product:r(PRODUCTS),
driver:driver,
seller:r(SALES),
hour:chance(0.72)?8+Math.floor(Math.random()*3):11+Math.floor(Math.random()*5)
};

showOrder();
}

function showOrder(){
const o=state.current;
const late=o.hour>=11;
const excuses=[
"The customer forgot to order.",
"The website wasn't working.",
"I thought I had already entered it.",
"The customer changed the order at the last minute.",
"AX was running slowly.",
"I was dealing with another customer.",
"It was in my notes. I just forgot to put it into AX.",
"The customer called me and I completely forgot to enter it."
];

render(`<div class="card">
<div class="tag">Order ${state.orderNo} / 20 • Sales → AX → Orders</div>
<h2>${o.customer}</h2>
<div class="box">
<b>Product:</b> ${o.product}<br>
<b>Salesperson:</b> ${o.seller}<br>
<b>AX entry:</b> ${String(o.hour).padStart(2,"0")}:00<br>
<b>Required cut-off:</b> 11:00<br>
<b>Assigned driver:</b> ${o.driver}
</div>
${late?`<div class="box"><b>${o.seller} – Sales:</b> "${r(excuses)}"</div>`:""}
<p class="story">${late?
"This order was entered after the 11:00 cut-off. The warehouse has already planned the workload.":
"The order is in AX on time. For once, everything looks normal."}</p>
<button class="primary" onclick="pickOrder('rush')">Rush it through picking</button>
<button onclick="pickOrder('normal')">Follow the normal picking sequence</button>
<button onclick="pickOrder('check')">Double-check everything</button>
</div>`);
}

function pickOrder(mode){
if(chance(0.14)){
const axEvents=[
["AX LOGIN FAILURE","AX refuses to log in for one workstation. The user swears the password is correct.",90],
["AX ORDER NOT VISIBLE","Sales says the order is in AX, but it is not appearing in the warehouse queue.",140],
["AX DUPLICATE ORDER","AX shows two versions of the same order with different quantities.",120],
["AX WRONG STATUS","The order is marked as ready in AX, but the warehouse has not picked it.",160],
["AX WRONG DELIVERY DATE","The delivery date in AX does not match the route plan.",130],
["AX CUSTOMER MISMATCH","The customer name in AX does not match the sales message.",150],
["AX QUANTITY MISMATCH","AX shows 12 cartons while the printed picking information says 10.",140],
["AX PRODUCT CODE ISSUE","The product description is correct but the AX item code points to another product.",180],
["AX ORDER LOCKED","The order appears to be locked in AX and cannot be edited.",120],
["AX SAVE FAILED","A salesperson says they saved the order, but the latest changes are not there.",130],
["AX SLOW AGAIN","AX is responding so slowly that every change takes forever.",100],
["AX ROUTE DISAPPEARED","The order had a route assigned earlier. Now AX shows no route.",160],
["AX ORDER RELEASED TWICE","The same order has been released to the warehouse twice.",150],
["AX MISSING LINE","One line exists on the customer's confirmation but not in the AX order.",170],
["AX OLD VERSION","Someone is working from an old AX version of the order.",140],
["AX SEARCH DOES NOTHING","The order exists, but AX search refuses to find it.",100],
["AX WRONG STOCK","AX says stock is available. The warehouse shelf says otherwise.",180],
["AX TIMESTAMP CONFUSION","Nobody can agree when the order was actually entered into AX.",110],
["AX PRINTER PROBLEM","AX sends the picking document to the wrong printer.",80],
["AX SESSION EXPIRED","The session has expired just as the order is being released.",90]
];
const e=r(axEvents);
state.incidents++;
state.money-=e[2];
if(chance(0.30)) state.ontime=Math.max(0,state.ontime-1);
save();
return render(`<div class="card"><div class="tag">AX system incident</div><h2>${e[0]}</h2><p class="story">${e[1]}</p><div class="box bad">Operational impact: -${money(e[2])} ISK</div><button class="primary" onclick="continueAfterAX()">Sort out AX and continue →</button><button onclick="continueAfterAX()">Work around AX manually →</button></div>`);
}


if(chance(0.16)){
const e=r([
["PICKER CALLED AWAY","One of the pickers has been called to help with another urgent order.",80],
["WRONG SHELF","The item is listed in AX, but the shelf location is empty.",120],
["CUSTOMER CHANGED THEIR MIND","The customer has changed one item after picking started.",100],
["SALES FORGOT A NOTE","A note from the salesperson was never entered into AX.",90],
["TWO ORDERS LOOK IDENTICAL","Two orders have almost identical customer names and the team has to verify both.",130],
["PALLET WRAP GONE","The pallet wrapper is out of film at exactly the wrong moment.",70],
["HANDWRITTEN NOTE","A handwritten note appears on the order: 'URGENT!!!' Nobody knows who wrote it.",60],
["UNEXPECTED PRIORITY","A salesperson calls the order 'critical' without explaining why.",90],
["MISSING SKU INFORMATION","The order contains a product description but no useful SKU reference.",110],
["BOX TOO SMALL","The selected carton is too small and has to be replaced.",60],
["FORKLIFT TRAFFIC","The aisle is temporarily blocked by forklift traffic.",80],
["COUNTING AGAIN","Someone counted the cartons three times and got three different answers.",100],
["ORDER MOVED AGAIN","The order was moved to another staging position without telling the picking team.",120],
["URGENT MESSAGE FROM SALES","A message arrives saying the customer is 'waiting right now'.",70],
["FREEZER SPACE NEEDED","The frozen section needs the staging area for another urgent order.",100]
]);
state.incidents++;
state.money-=e[2];
if(chance(.35))state.ontime=Math.max(0,state.ontime-1);
save();
return render(`<div class="card"><div class="tag">Random warehouse event</div><h2>${e[0]}</h2><p class="story">${e[1]}</p><div class="box bad">Operational impact: -${money(e[2])} ISK</div><button class="primary" onclick="continueAfterRandom()">Handle it and continue →</button></div>`);
}
let probability=0.28;
if(state.current.hour>=11)probability+=0.16;
if(mode==="rush")probability+=0.05;
if(mode==="check")probability-=0.08;

if(chance(probability))return orderProblem();
dispatch();
}

function continueAfterAX(){
if(chance(0.35)) state.money-=22;
if(chance(0.20)) state.ontime=Math.max(0,state.ontime-1);
clamp();save();dispatch();
}

function continueAfterRandom(){
clamp();save();dispatch();
}

function orderProblem(){
const o=state.current;
const problems=[
["WRONG ORDER LABEL",`${o.seller} labelled the order incorrectly. Two similar orders were nearly mixed up.`,140],
["WRONG PRODUCT","Someone from Orders picked the wrong product. Re-picking is required.",180],
["WRONG LOCATION","Someone put the completed order in the wrong location. <b>Daniel Dagur</b> has to search for it.",170],
["MISSING CARTON","One carton is missing from the completed order. Nobody knows where it went.",150],
["LATE PICKING","The order arrived too late from Sales and missed the planned picking window.",220],
["QUANTITY MISMATCH","The quantity picked does not match the order. Another count is required.",130],
["DUPLICATE ORDER","The same customer appears twice in AX and nobody knows which version is final.",100],
["WRONG CUSTOMER","The order was attached to the wrong customer account.",160],
["PRODUCT DOES NOT EXIST","AX says the item exists. The warehouse says otherwise.",190],
["TEMPERATURE MIX-UP","Frozen/chilled goods were placed in the wrong temperature zone.",180],
["ORDER NOT COMPLETE","One section of the order was never picked.",200],
["BAD HANDOVER","The order was moved before the picking team finished checking it.",160],
["LAST-MINUTE SALES CHANGE",`${o.seller} calls to change several lines after picking has already started.`,210],
["CUSTOMER ADDED ONE MORE THING","The customer added an item after the order was released to the warehouse.",170],
["SCANNER FAILURE","A handheld scanner stops working halfway through picking.",190],
["BARCODE MISMATCH","The barcode does not match AX. Manual verification is required.",160],
["PALLET OVERFLOW","The order will not fit safely on the planned pallet.",130],
["MISSING DELIVERY NOTE","The goods are ready but the delivery documentation is missing.",120],
["DAMAGED CARTON","A carton is damaged during picking and needs repacking.",150],
["STOCK COUNT DISAGREEMENT","AX says five units. The shelf says four.",180],
["SAME CUSTOMER, TWO ROUTES","The same customer has orders assigned to two different routes.",140],
["ORDER RELEASED TOO EARLY","An order was released before all warehouse sections finished.",160],
["ORDER STUCK IN AX","The order is visible but did not properly enter the warehouse queue.",200],
["COLD ROOM DELAY","The chilled section is backed up and this order is waiting.",140],
["FREEZER QUEUE","Several frozen orders arrived at once and the freezer team is overloaded.",180],
["MIXED PALLET CHAOS","Goods for three customers were temporarily placed on the same pallet.",220],
["PICKER READ THE WRONG LINE","A similar-looking product line was selected instead.",150],
["MISSING RETURNABLES","The customer expects returnable equipment that is not with the order.",120],
["WRONG DELIVERY WINDOW","The order was assigned a delivery window that does not match the customer request.",170],
["ORDER FOUND IN WRONG AISLE","The completed carton is finally found — in an aisle where it should not be.",160],
["SHORT PICK","The picker reports that part of the order cannot be found on the shelf.",190],
["EXTRA CARTON","An unexplained extra carton appears on the pallet.",120],
["PALLET TAG SWAPPED","Two pallet tags have been swapped and the team has to identify both orders.",200]
];
const q=r(problems);
state.incidents++;
state.money-=q[2];
state.reputation-=1;
clamp();save();

render(`<div class="card">
<div class="tag">Orders / Warehouse incident</div>
<h2>${q[0]}</h2>
<p class="story">${q[1]}</p>
<div class="box bad">Operational cost: -${money(q[2])} ISK</div>
<button class="primary" onclick="dispatch()">Fix the problem and continue →</button>
</div>`);
}


function successRate(){
  const total=state.orderNo||0;
  const good=state.profitOrders||0;
  return total ? Math.round((good/total)*100) : 0;
}
function dispatch(){
const o=state.current;

if(chance(0.11)){
const e=r([
["AX STATUS DELAY","The order is packed, but AX still shows it as 'in progress'.","The warehouse knows it is ready, AX apparently does not.",100],
["AX ROUTE RESET","The assigned route disappeared from the order after a system refresh.","The driver is waiting while someone checks the route manually.",120],
["AX DUPLICATE RELEASE","AX has released the order again after it was already prepared.","Two people nearly start picking the same order.",150],
["AX DELIVERY CONFIRMATION DELAY","The delivery information has not synchronised correctly.","Customer Service is already asking for an update.",110],
["AX WRONG CUSTOMER CODE","The customer code displayed in AX does not match the dispatch paperwork.","The order needs manual verification before loading.",140]
]);
state.incidents++;
state.money-=e[3];
state.reputation=Math.max(0,state.reputation-1);
save();
return render(`<div class="card"><div class="tag">AX / Dispatch incident</div><h2>${e[0]}</h2><p class="story">${e[1]}</p><div class="box warn">${e[2]}</div><div class="box bad">Impact: -${money(e[3])} ISK</div><button class="primary" onclick="dispatch()">Fix it and continue →</button></div>`);
}

if(chance(0.085)){
const salesperson=r(SALES);
const praise=[
"You guys in the warehouse are doing a really good job lately. I really appreciate how quickly you handle things.",
"Honestly, the warehouse team has been great recently. Everything seems much smoother.",
"I have to say, you are making my job much easier. Really good work from the warehouse.",
"Great job lately. The customers have been happy with the deliveries.",
"I really appreciate your help. You guys always manage to get things sorted."
];
const asks=[
"Can you please push my customer's order to the front? It's really important.",
"Could you send this one with the first driver? The customer is waiting.",
"Can you squeeze one more pallet onto the route?",
"Can you check if we can get this delivered today even though it missed the cut-off?",
"Could you make sure my order is ready before the others?",
"Can you ask the driver to take one extra carton for me?",
"Could you just make an exception this time?",
"Can you put this one on the next truck even though it came in late?",
"Could you prioritise this customer? They are really important to me.",
"Can you make sure this gets picked before the rest of my orders?"
];
return render(`<div class="card">
<div class="tag">${salesperson} calls</div>
<h2>${salesperson} has some nice words for you.</h2>
<p class="story"><b>${salesperson}:</b> "${r(praise)}"</p>
<div class="box warn"><b>${salesperson}:</b> "By the way... ${r(asks)}"</div>
<button class="primary" onclick="salespersonChoice(0)">Sure, I'll see what I can do.</button>
<button onclick="salespersonChoice(1)">Follow the normal process.</button>
</div>`);
}
if(chance(0.075)){
const caller=r(SALES);
const questions=[
"Can you tell me if order #"+(100000+Math.floor(Math.random()*899999))+" has been picked yet?",
"Do you know where my order is?",
"Can you check what time my order was entered into AX?",
"How many pallets are on my customer's order?",
"Is the order ready to ship?",
"Can you tell me whether the order is in dry, chilled or frozen?",
"Has the order already left the warehouse?",
"Can you check whether my order has been assigned to a driver?",
"Do you know if the order is still waiting to be picked?",
"Can you tell me which route the order is on?",
"Can you check if the customer has another order today?",
"Is there a missing product on this order?"
];
const q=r(questions);
state.incidents++;
return render(`<div class="card">
<div class="tag">Sales phone call</div>
<h2>${caller} is calling.</h2>
<p class="story"><b>${caller}:</b> "${q}"</p>
<div class="box warn">You know this information is normally visible directly in AX / the warehouse system.</div>
<button class="primary" onclick="sellerCallChoice(0)">Check it for them anyway</button>
<button onclick="sellerCallChoice(1)">Ask them to check AX first</button>
<button onclick="sellerCallChoice(2)">Tell them you'll call back when you have time</button>
</div>`);
}

if(chance(0.10)){
const e=r([
["EIMSKIP RECEIVING DELAY","The shipment is ready, but the receiving status from Eimskip has not appeared yet.",160],
["PALLET COLLECTION ORDER","The driver is about to collect pallets out of sequence. Someone needs to stop the process.",140],
["MISSING PALLET TAG","One pallet tag is missing. The team has to identify the pallet manually.",120],
["LOADING AREA BLOCKED","Another vehicle has blocked the loading area at exactly the wrong moment.",100],
["SECOND DELIVERY REQUEST","Sales calls with another delivery they would like to squeeze onto the same route.",130],
["CUSTOMER SERVICE ESCALATION",`${r(SERVICE)} says the customer has already called twice about this delivery.`,170],
["LAST-MINUTE CARTON","Sales brings one additional carton and says it belongs with this order.",140],
["WAREHOUSE PHONE MARATHON","Three calls arrive almost simultaneously about three different orders.",90]
]);
state.incidents++;state.money-=e[2];state.reputation=Math.max(0,state.reputation-1);save();
return render(`<div class="card"><div class="tag">Dispatch interruption</div><h2>${e[0]}</h2><p class="story">${e[1]}</p><div class="box bad">Operational impact: -${money(e[2])} ISK</div><button class="primary" onclick="dispatch()">Sort it out and continue →</button></div>`);
}
const cs=chance(0.38)?r(SERVICE):null;
const caller=chance(0.30)?r(CALLERS):null;
const forgotten=chance(0.12);

render(`<div class="card">
<div class="tag">Dispatch</div>
<h2>${o.driver} is ready to leave.</h2>
<p class="story">The pallet is loaded. The route is waiting. This is your final chance to catch a problem before the truck leaves.</p>
<div class="box"><b>Customer:</b> ${o.customer}<br><b>Driver:</b> ${o.driver}</div>
${cs?`<div class="box"><b>${cs} – Customer Service:</b> "Can you confirm the delivery time? The customer is asking."</div>`:""}
${caller?`<div class="box"><b>${caller} – Sales:</b> "Any update on my customer's order?"</div>`:""}
${forgotten?`<div class="box warn"><b>Loading warning:</b> Something may have been left behind.</div>`:""}
<button class="primary" onclick="drive(${forgotten},false)">Send the driver →</button>
<button onclick="drive(false,true)">Perform final carton check →</button>
</div>`);
}

function sellerCallChoice(i){
if(i===0){
state.money-=20;
}else if(i===1){
state.money+=10;
}else{
state.reputation-=1;
}
clamp();save();dispatch();
}

function salespersonChoice(i){
if(i===0){
state.money+=35;
state.reputation+=1;
if(chance(0.35))state.ontime-=1;
}else{
state.reputation+=1;
}
clamp();save();dispatch();
}

function drive(forgotten,checked){
if(forgotten&&!checked&&chance(0.75)){
state.incidents++;
state.money-=50;
state.reputation-=2;
clamp();save();
render(`<div class="card">
<div class="tag">Driver problem</div>
<h2>One carton stayed behind.</h2>
<p class="story"><b>${state.current.driver}</b> calls from the road: "I think I forgot one carton."</p>
<p class="story">The carton is still in the warehouse. The customer is already waiting.</p>
<button class="primary" onclick="finishOrder(true)">Send a rescue delivery →</button>
<button onclick="finishOrder(true)">Wait for the next scheduled route</button>
</div>`);
return;
}

let p=checked?0.10:0.30;
if(chance(p))return driverProblem();
finishOrder(true);
}

function driverProblem(){
const o=state.current;
const problems=[
["WRONG ADDRESS",`${o.driver} followed the wrong address and is nowhere near the planned stop.`,320],
["PARKING TICKET",`${o.driver} received a parking ticket on Laugavegur.`,500],
["CUSTOMER UNAVAILABLE","The customer is not available and the driver is waiting outside.",180],
["MISSING CONFIRMATION","Goods were delivered, but the delivery confirmation is missing.",120],
["TRAFFIC DELAY","Traffic turned a normal delivery into a long delay.",150],
["WRONG PALLET","The driver loaded the wrong pallet. The correct one is still at the warehouse.",300],
["CUSTOMER COMPLAINT","The customer is angry because the goods arrived late.",220],
["PHONE BATTERY DEAD",`${o.driver}'s phone battery died just as the driver needed the delivery address.`,140],
["KEY ACCESS PROBLEM","The driver cannot access the delivery area because the agreed access procedure is not working.",190],
["DELIVERY DOOR BLOCKED","The delivery entrance is blocked by another vehicle.",160],
["PALLET JACK PROBLEM","The driver cannot safely move the pallet at the delivery point.",180],
["ROAD CONDITIONS","Poor road conditions have slowed the route significantly.",210],
["FUEL STOP","The vehicle needs an unexpected fuel stop before the next delivery.",90],
["DRIVER MISREAD THE ROUTE",`${o.driver} followed an old route note instead of today's route plan.`,240],
["WRONG ENTRANCE","The driver is at the correct address but the wrong entrance.",110],
["CUSTOMER REQUESTS EXTRA DROP","The customer asks the driver to take the goods to another location on the property.",120],
["DELIVERY WINDOW MISSED","The driver arrives outside the customer's preferred delivery window.",210],
["CUSTOMER SENT THE WRONG PIN","The customer sent an outdated map pin and the driver ends up at the wrong entrance.",170],
["DELIVERY NEEDS SIGNATURE","The customer suddenly says someone must sign in person, although this was not in the notes.",100],
["UNLOADING SPACE OCCUPIED","There is no space to unload and the driver has to wait.",140],
["PALLET TOO HEAVY","The customer cannot move the pallet with their available equipment.",160],
["DRIVER CALLED BY CUSTOMER","The customer calls the driver directly and asks for a completely different delivery time.",90],
["ROADWORKS","Roadworks have closed the usual approach to the customer.",190],
["WRONG STORE ENTRANCE","The driver arrives at the right store but the receiving entrance has changed.",120]
];
const q=r(problems);
state.incidents++;
state.money-=q[2];
state.reputation-=2;
state.ontime=Math.max(0,state.ontime-1);
clamp();save();

render(`<div class="card">
<div class="tag">Driver / Customer incident</div>
<h2>${q[0]}</h2>
<p class="story">${q[1]}</p>
<div class="box bad">Impact: -${money(q[2])} ISK</div>
<button class="primary" onclick="finishOrder(false)">Handle the situation →</button>
</div>`);
}

function finishOrder(success){
  // Final order settlement.  The business is intentionally profitable:
  // 70% of deliveries are clean successes, 30% have a problem,
  // but even a problem order still contributes positive revenue.
  if(success){
    state.good++;
    state.totalGood++;
    state.profitOrders=(state.profitOrders||0)+1;
    state.money += 1500;
    state.reputation=Math.min(100,state.reputation+1);

    if(chance(0.35)){
      const bonus=r([
        ["FAST DELIVERY BONUS","The order was completed smoothly and ahead of expectation.",300],
        ["CUSTOMER SERVICE BONUS","The customer was especially happy with the delivery.",250],
        ["ROUTE EFFICIENCY BONUS","The route was completed efficiently.",350],
        ["EXTRA MARGIN","Additional items increased the margin on this order.",400]
      ]);
      state.money+=bonus[2];
      state.reputation=Math.min(100,state.reputation+1);
    }
  }else{
    // A problematic delivery still earns revenue; it simply earns less.
    state.money += 800;
    state.ontime=Math.max(0,state.ontime-1);
  }

  if(chance(0.16)){
    state.incidents++;
    const person=r(SERVICE);
    const question=r([
      "Can you confirm the delivery time?",
      "The customer says one product is missing. Can you check?",
      "Can you confirm whether the frozen goods were delivered?",
      "The customer is asking why the order arrived late.",
      "Do we know where the missing carton is?",
      "The customer says they received the wrong quantity.",
      "Can you confirm whether the full order left the warehouse?",
      "The customer says one carton was delivered to the wrong area.",
      "Can you check whether the order was picked yesterday or today?",
      "The customer says part of the shipment arrived separately."
    ]);
    clamp();save();
    render(`<div class="card">
      <div class="tag">Customer Service follow-up</div>
      <h2>${person} is calling.</h2>
      <p class="story"><b>${person}:</b> "${question}"</p>
      <button class="primary" onclick="nextOrder()">Check the details and reply →</button>
    </div>`);
    return;
  }

  clamp();save();nextOrder();
}

function endDay(){
render(`<div class="card">
<div class="tag">End of day</div>
<h2>Day ${state.day} complete</h2>
<p class="story"><b>20 orders</b> processed. Tomorrow, you do it all again.</p>
<table>
<tr><th>Orders processed</th><td>20</td></tr>
<tr><th>Successful deliveries</th><td>${state.good}</td></tr>
<tr><th>Incidents</th><td>${state.incidents}</td></tr>
<tr><th>Budget</th><td>${money(state.money)} ISK</td></tr>
<tr><th>Reputation</th><td>${state.reputation}/100</td></tr>
</table>
<button class="primary" onclick="nextDay()">Start Day ${state.day+1} →</button>
<button onclick="reset()">Reset game</button>
</div>`);
}

function nextDay(){
state.day++;
if(state.day>30)return monthEnd();
save();
startDay();
}

function monthEnd(){
const score=state.money+state.reputation*50+state.ontime*40;
render(`<div class="card">
<div class="tag">Monthly management review</div>
<h2>30 Days Completed</h2>
<p class="story">You survived approximately <b>600 orders</b>. The warehouse is still standing.</p>
<table>
<tr><th>Days completed</th><td>30</td></tr>
<tr><th>Orders processed</th><td>${state.totalOrders}</td></tr>
<tr><th>Successful deliveries</th><td>${state.totalGood}</td></tr>
<tr><th>Budget</th><td>${money(state.money)} ISK</td></tr>
<tr><th>Reputation</th><td>${state.reputation}/100</td></tr>
<tr><th>On-time rate</th><td>${state.ontime}%</td></tr>
<tr><th>Final score</th><td>${money(score)}</td></tr>
</table>
<button class="primary" onclick="reset()">Start a new month</button>
</div>`);
}

function clamp(){
state.reputation=Math.max(0,Math.min(100,state.reputation));
state.ontime=Math.max(0,Math.min(100,state.ontime));
}

load();
home();
</script>
</body>
</html>
